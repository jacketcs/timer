<!DOCTYPE html>
<html>
<head>
  <title>Countdown Timer</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }

    .timer-container h2 {
      margin: 10px 0;
      text-align: center;
    }

    .timer-container h1 {
      margin: 0;
      color: black;
      font-size: 180px;
      line-height: 1;
    }

    .timer-container h1.red-flash {
     /* animation: flash 1s infinite;*/
      color: red;
    }

    @keyframes flash {
      0% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    .timer-controls {
      display: flex;
      align-items: center;
    }

    .main-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }

    .primary-controls {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .primary-controls button {
      font-size: 24px;
      font-weight: bold;
      padding: 12px 30px;
      margin: 0 8px;
    }

    .side-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .minute-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .minute-row {
      display: flex;
    }

    .minute-row button {
      margin: 5px;
      font-size: 16px;
      padding: 10px 20px;
    }

    .adjust-stack {
      display: flex;
      justify-content: center;
    }

    .adjust-stack button {
      margin: 5px;
      font-size: 16px;
      padding: 10px 20px;
    }

    .pause-button {
      font-size: 16px;
      padding: 10px 20px;
    }

    .logo-image {
      width: 200px;
    }
  </style>
</head>
<body>
  <img src="cob logo.png" alt="Logo" class="logo-image">
  <br>
  <div class="main-row">
    <div class="timer-container">
      <h2>City of Berkeley <br>City Council Meeting Timer</h2>
      <h1 id="timer">00:00</h1>
      <div class="primary-controls">
        <button onclick="startTimer()" class="start-button">Start</button>
        <button onclick="resetTimer()" class="reset-button">Reset</button>
      </div>
    </div>

    <div class="side-column">
      <div class="minute-group">
        <div class="minute-row">
          <button onclick="setTime(5)">5 minutes</button>
          <button onclick="setTime(3)">3 minutes</button>
        </div>
        <div class="minute-row">
          <button onclick="setTime(2)">2 minutes</button>
          <button onclick="setTime(1)">1 minute</button>
        </div>
        <div class="adjust-stack">
          <button onclick="adjustTime(60)">+1 min</button>
          <button onclick="adjustTime(-60)">-1 min</button>
        </div>
      </div>
      <button onclick="pauseTimer()" class="pause-button">Pause</button>
    </div>
  </div>

  <script>
    let timerElement = document.getElementById('timer');
    let countdown;
    let secondsRemaining;
    let startingTime;

    function setTime(minutes) {
      secondsRemaining = minutes * 60;
      startingTime = secondsRemaining;
      updateTimerDisplay();
    }

    setTime(5);

    function updateTimerDisplay() {
      let minutes = Math.floor(secondsRemaining / 60);
      let seconds = secondsRemaining % 60;
      let formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      timerElement.textContent = formattedTime;

      if (secondsRemaining < 30) {
        timerElement.classList.add('red-flash');
      } else {
        timerElement.classList.remove('red-flash');
      }
    }

    function startTimer() {
      if (countdown) return;
      
      countdown = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();
        
        if (secondsRemaining <= 0) {
          clearInterval(countdown);
          countdown = null;
          playAlarmSound();
        }
      }, 1000);
    }

 
    function playAlarmSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const chimeCount = 3;
      const notes = [880, 660]; // gentle two-note "ding-dong" chime
      for (let i = 0; i < chimeCount; i++) {
        notes.forEach((freq, noteIndex) => {
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.type = 'sine';
          oscillator.frequency.value = freq;
          const startTime = audioCtx.currentTime + i * 1.0 + noteIndex * 0.28;
          gainNode.gain.setValueAtTime(0.001, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.5, startTime + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);
          oscillator.start(startTime);
          oscillator.stop(startTime + 0.5);
        });
      }
    }

    function pauseTimer() {
      if (countdown) {
        clearInterval(countdown);
        countdown = null;
      } else {
        startTimer();
      }
    }

    function resetTimer() {
      secondsRemaining = startingTime;
      updateTimerDisplay();
    }

    function adjustTime(deltaSeconds) {
      secondsRemaining += deltaSeconds;
      if (secondsRemaining < 0) {
        secondsRemaining = 0;
      }
      updateTimerDisplay();
    }
  </script>
</body>
</html>
